# Northstar OS secret-scanning config (Tier-1 security pass, 2026-10-15).
# Extends the default gitleaks rules; adds ONLY reviewed false positives.
# Credential-shaped hits in chat transcripts are intentionally NOT allowlisted
# (see reports/tier1_install_and_launch_20261015.md).

[extend]
useDefault = true

[[allowlists]]
description = "FP: security-test fixtures (fake secrets used to prove the redactor works)"
paths = ['''tests[\\/]security[\\/]''']
[[allowlists]]
description = "FP: test-module synthetic adapters/payloads"
paths = ['''Northstar_backend[\\/]test_proof_batch_run\.py$''', '''Northstar_backend[\\/]test_normalized_snapshot\.py$''']
[[allowlists]]
description = "FP: scraped third-party HTML fixtures (page JS tokens)"
paths = ['''Northstar_backend[\\/]fixtures[\\/]brightdata_costco[\\/]''']
[[allowlists]]
description = "FP: Faire product-data JSON (product ids)"
paths = ['''Northstar_backend[\\/]data[\\/]faire[\\/]''']
[[allowlists]]
description = "FP: budget-ledger sha256 values"
paths = ['''budget-ledger\.jsonl$''']
[[allowlists]]
description = "FP: docs sample auth header"
paths = ['''docs[\\/]API_REFERENCE\.md$''']
[[allowlists]]
description = "FP: retired creative_pipeline.py model-registry keys (e.g. \"key\": \"<model-id>\")"
paths = ['''creative_pipeline\.py$''']
[[allowlists]]
description = "FP: creative_crew.py reads the OpenAI API-key env var NAME to pass it to a local llama.cpp endpoint; the value is never present in the file and defaults to a literal 'local'"
paths = ['''Northstar_backend[\\/]creative_crew\.py$''']
