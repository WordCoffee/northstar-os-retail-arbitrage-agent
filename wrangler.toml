# Cloudflare deploy (B5-aligned, honest) — Pages + Pages Functions ONLY.
# This project deploys as Cloudflare Pages (static, build dir `public`) with
# Pages Functions for `/api/*`. There is deliberately NO Workers compute layer
# and no separate Workers backend: every `functions/api/*` response conforms to
# the bff/v1 envelope (docs/contracts/BFF_CONTRACT_v1.md). Do not add a Workers
# binder or a second compute target here without operator sign-off.
name = "northstar-arbitrage-dashboard"
pages_build_output_dir = "public"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2026-01-01"

[[kv_namespaces]]
binding = "DEALS_KV"
id = "dfb0374956e1410bbd0f6e8d1ac520e3"