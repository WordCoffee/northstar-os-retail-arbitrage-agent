# Hosted stack (P2-T2): api + worker + scheduler + postgres + caddy.
# The previous local-only Ollama/AutothinK compose file is preserved as
# docker-compose.local.yml.
#
# Local run:  docker compose up --build   -> UI at http://localhost/ui/
# No secrets are baked in: set real values in a local .env (gitignored) or the
# environment. Dev defaults below are clearly non-production.

x-foundation-env: &foundation-env
  FOUNDATION_DB_URL: postgresql://${POSTGRES_USER:-northstar}:${POSTGRES_PASSWORD:-northstar_dev_only}@postgres:5432/${POSTGRES_DB:-northstar}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  # Dev posture: allow remote bind while the dev shim is active (P2-T5 replaces
  # this with real JWT auth on hosted environments).
  NS_FOUNDATION_ALLOW_REMOTE_DEV: ${NS_FOUNDATION_ALLOW_REMOTE_DEV:-1}
  NORTHSTAR_UI_MODE: ${NORTHSTAR_UI_MODE:-full}
  NORTHSTAR_OWNER_TEST_MODE: ${NORTHSTAR_OWNER_TEST_MODE:-0}
  NORTHSTAR_JWT_SECRET: ${NORTHSTAR_JWT_SECRET:-}
  NORTHSTAR_JWT_ISSUER: ${NORTHSTAR_JWT_ISSUER:-https://northstar.local}
  NORTHSTAR_JWT_AUDIENCE: ${NORTHSTAR_JWT_AUDIENCE:-northstar-api}
  PYTHONUNBUFFERED: "1"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-northstar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-northstar_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-northstar}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-northstar} -d ${POSTGRES_DB:-northstar}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "foundation_migrate.py"]
    environment: *foundation-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment: *foundation-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "foundation_worker.py"]
    environment: *foundation-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "foundation_scheduler.py"]
    environment: *foundation-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data: