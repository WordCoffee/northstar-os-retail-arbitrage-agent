# Hosted stack (P2-T2): api + worker + scheduler + postgres + caddy.
# The previous local-only Ollama/AutothinK compose file is preserved as
# docker-compose.local.yml.
#
# Local run:  docker compose up --build   -> UI at http://localhost/ui/
# No secrets are baked in: set real values in a local .env (gitignored) or the
# environment. Dev defaults below are clearly non-production.

x-foundation-env: &foundation-env
  DB_URL: postgresql://${POSTGRES_USER:-northstar}:${POSTGRES_PASSWORD:-northstar_dev_only}@postgres:5432/${POSTGRES_DB:-northstar}
  FOUNDATION_DB_URL: postgresql://${POSTGRES_USER:-northstar}:${POSTGRES_PASSWORD:-northstar_dev_only}@postgres:5432/${POSTGRES_DB:-northstar}
  # Design Studio / data_layer store (Phase 8 item 2): the same Postgres
  # instance as the foundation store. With this set the ds_* tables live in
  # Postgres and survive container recreation; with it absent, data_layer falls
  # back to the container-local SQLite file. Schema creation is idempotent and
  # runs on every boot (data_layer._create_postgres_tables).
  DATABASE_URL: postgresql://${POSTGRES_USER:-northstar}:${POSTGRES_PASSWORD:-northstar_dev_only}@postgres:5432/${POSTGRES_DB:-northstar}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  # Dev posture: allow remote bind while the dev shim is active (P2-T5 replaces
  # this with real JWT auth on hosted environments).
  NS_FOUNDATION_ALLOW_REMOTE_DEV: ${NS_FOUNDATION_ALLOW_REMOTE_DEV:-1}
  NORTHSTAR_UI_MODE: ${NORTHSTAR_UI_MODE:-full}
  NORTHSTAR_OWNER_TEST_MODE: ${NORTHSTAR_OWNER_TEST_MODE:-0}
  # Harness login throttle bypass. Refused outright in production-like
  # environments (see foundation/login_throttle.test_bypass_enabled) and off
  # unless explicitly set to exactly "1".
  NORTHSTAR_LOGIN_THROTTLE_TEST_BYPASS: ${NORTHSTAR_LOGIN_THROTTLE_TEST_BYPASS:-0}
  # Edge rate limiter opt-out for larger local test suites. Already fail-closed:
  # main.lifespan calls assert_prod_posture(), which REFUSES TO BOOT when this
  # is set and ENVIRONMENT=production (see rate_limiter.assert_prod_posture).
  NORTHSTAR_DISABLE_RATE_LIMIT: ${NORTHSTAR_DISABLE_RATE_LIMIT:-0}
  NORTHSTAR_JWT_SECRET: ${NORTHSTAR_JWT_SECRET:-}
  NORTHSTAR_JWT_ISSUER: ${NORTHSTAR_JWT_ISSUER:-https://northstar.local}
  NORTHSTAR_JWT_AUDIENCE: ${NORTHSTAR_JWT_AUDIENCE:-northstar-api}
  PYTHONUNBUFFERED: "1"
  # Fail-safe: a hosted deployment is cache-only. A live provider lane exists
  # only for one bounded, operator-armed run — never as a boot default.
  SCANNER_LIVE_ALLOWED: ${SCANNER_LIVE_ALLOWED:-0}
  # Per-run live bounds: the API refuses to boot with live mode armed unless
  # BOTH are set (see Northstar_backend/live_gate.assert_live_posture).
  NS_LIVE_PER_RUN_ARMED: ${NS_LIVE_PER_RUN_ARMED:-0}
  NS_LIVE_PER_RUN_CAP_CENTS: ${NS_LIVE_PER_RUN_CAP_CENTS:-0}

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-northstar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-northstar_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-northstar}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-northstar} -d ${POSTGRES_DB:-northstar}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_TIME: ${GIT_TIME:-}
    command: ["python", "foundation_migrate.py"]
    environment: *foundation-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_TIME: ${GIT_TIME:-}
    environment: *foundation-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    # Loopback-only publish so the Vite dev server (port 8101) can proxy to the
    # API during harness runs. It is not reachable off-host.
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_TIME: ${GIT_TIME:-}
    command: ["python", "foundation_worker.py"]
    environment: *foundation-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8090"
    healthcheck:
      # P1-05: a polling loop must be able to say it is actually progressing.
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8090/readyz', timeout=4); exit(0 if r.status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_TIME: ${GIT_TIME:-}
    command: ["python", "foundation_scheduler.py"]
    environment: *foundation-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8091"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8091/readyz', timeout=4); exit(0 if r.status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_TIME: ${GIT_TIME:-}
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data: