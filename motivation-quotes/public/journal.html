<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal — Daily Dose</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .journal-list{display:flex;flex-direction:column;gap:1rem}
    .journal-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem 2rem;box-shadow:var(--shadow);transition:transform 0.2s;animation:fadeUp 0.4s ease-out both}
    .journal-card:hover{transform:translateY(-2px)}
    .journal-quote{font-family:'Playfair Display',serif;font-size:1.1rem;line-height:1.5;color:var(--ink);margin-bottom:0.75rem}
    .journal-meta{display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;font-size:0.72rem;color:var(--muted)}
    .journal-note{width:100%;margin-top:0.75rem;padding:0.6rem 0.8rem;font-family:'Caveat',cursive;font-size:1rem;color:var(--ink);background:var(--gold-light);border:1px dashed var(--gold);border-radius:var(--radius-sm);resize:vertical;min-height:50px;outline:none;transition:border-color 0.2s}
    .journal-note:focus{border-color:var(--rose)}
    .journal-note::placeholder{color:var(--muted)}
    .journal-actions{display:flex;gap:0.5rem;margin-top:0.75rem}
    .journal-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.8rem;padding:0.3rem 0.6rem;border-radius:100px;transition:all 0.2s}
    .journal-del:hover{color:var(--rose);background:var(--rose-light)}
    .search-bar{width:100%;padding:0.8rem 1.25rem;font-family:'Inter',sans-serif;font-size:0.9rem;color:var(--ink);background:var(--card);border:1.5px solid var(--border);border-radius:100px;outline:none;margin-bottom:1.5rem;transition:border-color 0.2s;box-shadow:var(--shadow)}
    .search-bar:focus{border-color:var(--gold)}
    .search-bar::placeholder{color:var(--muted)}
    .export-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:0.5rem}
    .export-bar .count{font-family:'Caveat',cursive;font-size:1.1rem;color:var(--muted)}
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-brand"><span>*</span> Daily Dose</a>
    <div class="nav-links">
      <a href="/" class="nav-link">Home</a>
      <a href="/journal.html" class="nav-link active">Journal</a>
      <a href="/daily.html" class="nav-link">Daily</a>
      <a href="/mood.html" class="nav-link">Mood</a>
      <a href="/games.html" class="nav-link">Games</a>
    </div>
  </nav>

  <div class="page-wrap">
    <div class="page-header">
      <h1>Quote Journal</h1>
      <p class="sub">your personal collection of good thoughts</p>
    </div>

    <input type="text" class="search-bar" id="searchBar" placeholder="Search your saved quotes...">

    <div class="export-bar">
      <span class="count" id="countLabel"></span>
      <div style="display:flex;gap:0.5rem;">
        <button class="btn btn-gold btn-sm" id="exportBtn">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export
        </button>
        <button class="btn btn-outline btn-sm" id="clearBtn" style="color:var(--rose)">Clear All</button>
      </div>
    </div>

    <div class="journal-list" id="journalList"></div>

    <div class="empty" id="emptyState" style="display:none">
      <div class="icon">📓</div>
      <h3>Your journal is empty</h3>
      <p>Go save some quotes that speak to you!</p>
      <a href="/" class="btn btn-dark" style="margin-top:1rem">Browse Quotes</a>
    </div>
  </div>

  <div class="music-bar">
    <button class="music-btn" id="playBtn" title="Play / Pause">
      <svg viewBox="0 0 24 24" id="playIcon"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </button>
    <span class="music-track" id="trackName">Press play for beats</span>
    <input type="range" class="music-vol" id="volSlider" min="0" max="100" value="35">
    <button class="music-next" id="nextBtn" title="Next track">
      <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
    </button>
  </div>

  <script src="/js/music.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const cap = s => s.charAt(0).toUpperCase() + s.slice(1).replace(/-/g,' ');

    $('playBtn').onclick = () => { beats.toggle(); updatePlayIcon(); };
    $('nextBtn').onclick = () => beats.next();
    $('volSlider').oninput = e => beats.setVolume(e.target.value / 100);
    beats.onTrackChange = (name) => { $('trackName').innerHTML = `<em>${name}</em>`; };
    function updatePlayIcon() {
      $('playIcon').innerHTML = beats.isPlaying
        ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
        : '<polygon points="5 3 19 12 5 21 5 3"/>';
    }

    function getFavs() { return JSON.parse(localStorage.getItem('dose_favs') || '[]'); }
    function saveFavs(favs) { localStorage.setItem('dose_favs', JSON.stringify(favs)); }

    const PILL = ['pill-gold','pill-rose','pill-sage','pill-navy','pill-lavender'];

    function render(filter='') {
      let favs = getFavs();
      if (filter) favs = favs.filter(f => f.text.toLowerCase().includes(filter.toLowerCase()) || (f.note||'').toLowerCase().includes(filter.toLowerCase()));

      const list = $('journalList');
      const empty = $('emptyState');
      const allFavs = getFavs();

      if (allFavs.length === 0) {
        list.innerHTML = '';
        empty.style.display = '';
        $('countLabel').textContent = '';
        return;
      }
      empty.style.display = 'none';
      $('countLabel').textContent = `${allFavs.length} saved quote${allFavs.length!==1?'s':''}`;

      list.innerHTML = favs.map((f, i) => {
        const pi = allFavs.indexOf(f) % PILL.length;
        return `
        <div class="journal-card">
          <div class="journal-quote">"${f.text}"</div>
          <div class="journal-meta">
            <span class="pill ${PILL[pi]}" style="font-size:0.6rem;padding:0.2rem 0.6rem">${cap(f.category)}</span>
            <span>${timeAgo(f.savedAt)}</span>
          </div>
          <textarea class="journal-note" placeholder="Add a personal note..." data-idx="${allFavs.indexOf(f)}">${f.note||''}</textarea>
          <div class="journal-actions">
            <button class="journal-del" data-idx="${allFavs.indexOf(f)}">Remove</button>
          </div>
        </div>`;
      }).join('');

      list.querySelectorAll('.journal-note').forEach(ta => {
        ta.oninput = () => {
          const favs = getFavs();
          favs[parseInt(ta.dataset.idx)].note = ta.value;
          saveFavs(favs);
        };
      });

      list.querySelectorAll('.journal-del').forEach(btn => {
        btn.onclick = () => {
          const favs = getFavs();
          favs.splice(parseInt(btn.dataset.idx), 1);
          saveFavs(favs);
          render($('searchBar').value);
        };
      });
    }

    function timeAgo(ts) {
      if (!ts) return '';
      const d = Date.now() - ts;
      if (d < 60000) return 'just now';
      if (d < 3600000) return Math.floor(d/60000) + 'm ago';
      if (d < 86400000) return Math.floor(d/3600000) + 'h ago';
      return Math.floor(d/86400000) + 'd ago';
    }

    $('searchBar').oninput = e => render(e.target.value);

    $('exportBtn').onclick = () => {
      const favs = getFavs();
      if (!favs.length) return;
      const text = favs.map(f => `"${f.text}" [${cap(f.category)}]${f.note ? '\n  Note: ' + f.note : ''}`).join('\n\n');
      navigator.clipboard.writeText(text).then(() => {
        const t = document.createElement('div');
        t.className = 'toast'; t.textContent = 'Copied to clipboard!';
        document.body.appendChild(t);
        setTimeout(()=>t.remove(), 1500);
      });
    };

    $('clearBtn').onclick = () => {
      if (confirm('Clear all saved quotes?')) {
        saveFavs([]);
        render();
      }
    };

    render();
  </script>

  <!-- Universal Voice Integration -->
  <script type="module">
    import { autoInit } from '/components/universal-voice.js';
    autoInit({ serverUrl: 'http://localhost:3001' });
  </script>
</body>
</html>
