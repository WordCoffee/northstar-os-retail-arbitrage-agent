<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mood Board — Daily Dose</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .mood-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0.75rem;margin-bottom:2rem}
    .mood-btn{padding:1.25rem 0.75rem;font-size:0.82rem;font-weight:600;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--card);color:var(--ink);cursor:pointer;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);text-align:center;box-shadow:var(--shadow)}
    .mood-btn .emoji{font-size:1.8rem;display:block;margin-bottom:0.5rem}
    .mood-btn:hover{transform:translateY(-4px) scale(1.03)}
    .mood-btn.selected{border-color:var(--gold);color:white;transform:translateY(-4px) scale(1.05);box-shadow:var(--shadow-lg)}
    .mood-btn[data-mood="happy"]{--mc:#b8956a}.mood-btn[data-mood="calm"]{--mc:#7a9b8a}
    .mood-btn[data-mood="motivated"]{--mc:#c17b7b}.mood-btn[data-mood="anxious"]{--mc:#8b7bb5}
    .mood-btn[data-mood="tired"]{--mc:#3d4f6f}.mood-btn[data-mood="sad"]{--mc:#6b8db5}
    .mood-btn[data-mood="grateful"]{--mc:#7a9b8a}.mood-btn[data-mood="brave"]{--mc:#c17b7b}
    .mood-btn.selected{background:var(--mc);border-color:var(--mc)}

    .mood-result{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem;box-shadow:var(--shadow);text-align:center;margin-bottom:1.5rem;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .mood-prompt{font-family:'Caveat',cursive;font-size:1.3rem;color:var(--gold);margin-bottom:1rem}
    .mood-quote{font-family:'Playfair Display',serif;font-size:clamp(1.15rem,3.5vw,1.7rem);line-height:1.5;color:var(--ink)}
    .mood-quote-actions{margin-top:1.25rem;display:flex;justify-content:center;gap:0.5rem}

    .breathing-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;box-shadow:var(--shadow);text-align:center;margin-bottom:1.5rem}
    .breathing-section h3{font-family:'Playfair Display',serif;font-size:1.3rem;margin-bottom:0.5rem}
    .breathing-section .sub{font-size:0.82rem;color:var(--muted);margin-bottom:1.5rem}
    .breath-circle-wrap{width:160px;height:160px;margin:0 auto 1.25rem;position:relative;display:flex;align-items:center;justify-content:center}
    .breath-circle{width:80px;height:80px;border-radius:50%;background:var(--sage);transition:all 4s ease-in-out;opacity:0.8}
    .breath-circle.inhale{width:150px;height:150px;opacity:1;background:var(--gold)}
    .breath-circle.hold{width:150px;height:150px;opacity:0.9;background:var(--navy)}
    .breath-circle.exhale{width:80px;height:80px;opacity:0.6;background:var(--sage)}
    .breath-text{position:absolute;font-family:'Caveat',cursive;font-size:1.2rem;color:var(--gold);font-weight:600}
    .breath-instruction{font-size:0.82rem;color:var(--muted);min-height:1.2em}

    .affirmation-card{background:var(--sage-light);border:1px solid rgba(122,155,138,0.3);border-radius:var(--radius);padding:1.5rem 2rem;text-align:center}
    .affirmation-card h4{font-family:'Caveat',cursive;font-size:1.3rem;color:var(--sage);margin-bottom:0.5rem}
    .affirmation-card p{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--ink);line-height:1.5}
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-brand"><span>*</span> Daily Dose</a>
    <div class="nav-links">
      <a href="/" class="nav-link">Home</a>
      <a href="/journal.html" class="nav-link">Journal</a>
      <a href="/daily.html" class="nav-link">Daily</a>
      <a href="/mood.html" class="nav-link active">Mood</a>
      <a href="/games.html" class="nav-link">Games</a>
    </div>
  </nav>

  <div class="page-wrap">
    <div class="page-header">
      <h1>How Are You Feeling?</h1>
      <p class="sub">pick a mood, get a moment</p>
    </div>

    <div class="mood-grid" id="moodGrid"></div>

    <div class="mood-result" id="moodResult" style="display:none">
      <div class="mood-prompt" id="moodPrompt"></div>
      <div class="mood-quote" id="moodQuote"></div>
      <div class="mood-quote-actions">
        <button class="btn btn-dark btn-sm" id="moodNew">New Quote</button>
        <button class="btn btn-outline btn-sm" id="moodSave">Save</button>
      </div>
    </div>

    <div class="breathing-section">
      <h3>Breathe With Me</h3>
      <p class="sub">4-7-8 technique — follow the circle</p>
      <div class="breath-circle-wrap">
        <div class="breath-circle" id="breathCircle"></div>
        <span class="breath-text" id="breathText">Ready?</span>
      </div>
      <p class="breath-instruction" id="breathInstruction"></p>
      <button class="btn btn-sage btn-sm" id="breathBtn" style="margin-top:0.75rem">Start Breathing</button>
    </div>

    <div class="affirmation-card">
      <h4>Today's Affirmation</h4>
      <p id="affirmation"></p>
    </div>
  </div>

  <div class="music-bar">
    <button class="music-btn" id="playBtn" title="Play / Pause">
      <svg viewBox="0 0 24 24" id="playIcon"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </button>
    <span class="music-track" id="trackName">Press play for beats</span>
    <input type="range" class="music-vol" id="volSlider" min="0" max="100" value="35">
    <button class="music-next" id="nextBtn" title="Next track">
      <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
    </button>
  </div>

  <script src="/js/music.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const cap = s => s.charAt(0).toUpperCase() + s.slice(1).replace(/-/g,' ');

    $('playBtn').onclick = () => { beats.toggle(); updatePlayIcon(); };
    $('nextBtn').onclick = () => beats.next();
    $('volSlider').oninput = e => beats.setVolume(e.target.value / 100);
    beats.onTrackChange = (name) => { $('trackName').innerHTML = `<em>${name}</em>`; };
    function updatePlayIcon() {
      $('playIcon').innerHTML = beats.isPlaying
        ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
        : '<polygon points="5 3 19 12 5 21 5 3"/>';
    }

    const MOODS = [
      { id:'happy', emoji:'\u{1F60A}', label:'Happy', category:'humor', prompts:['You\'re glowing!','That smile looks good on you.','What a mood to be in!'] },
      { id:'calm', emoji:'\u{1F343}', label:'Calm', category:'perspective', prompts:['Peace looks beautiful on you.','Breathe. You\'re exactly where you need to be.','Still waters run deep.'] },
      { id:'motivated', emoji:'\u{1F525}', label:'Motivated', category:'action', prompts:['Let\'s go!','That fire is contagious.','Channel that energy!'] },
      { id:'anxious', emoji:'\u{1F30A}', label:'Anxious', category:'discipline', prompts:['It\'s okay to feel this way.','Let\'s ground ourselves.','You\'ve survived every bad day so far.'] },
      { id:'tired', emoji:'\u{1F634}', label:'Tired', category:'discipline', prompts:['Rest is productive too.','You\'ve done enough today.','Tomorrow is a fresh start.'] },
      { id:'sad', emoji:'\u{1F327}\uFE0F', label:'Sad', category:'perspective', prompts:['Feel it. Then let it pass.','Sadness is just love with nowhere to go.','This too shall pass.'] },
      { id:'grateful', emoji:'\u{1F64F}', label:'Grateful', category:'perspective', prompts:['What a beautiful heart you have.','Gratitude changes everything.','The world is better with you in it.'] },
      { id:'brave', emoji:'\u{1F981}', label:'Brave', category:'action', prompts:['You\'re braver than you believe.','Courage isn\'t the absence of fear.','You\'ve got this, warrior.'] }
    ];

    let allQuotes = [];
    let currentMood = null;
    let currentMoodQuote = null;

    function renderMoods() {
      $('moodGrid').innerHTML = MOODS.map(m => `
        <button class="mood-btn" data-mood="${m.id}">
          <span class="emoji">${m.emoji}</span>
          ${m.label}
        </button>
      `).join('');
      $('moodGrid').querySelectorAll('.mood-btn').forEach(btn => {
        btn.onclick = () => selectMood(btn.dataset.mood);
      });
    }

    function selectMood(moodId) {
      currentMood = MOODS.find(m => m.id === moodId);
      document.querySelectorAll('.mood-btn').forEach(b => b.classList.toggle('selected', b.dataset.mood === moodId));
      $('moodResult').style.display = '';
      showMoodQuote();
    }

    function showMoodQuote() {
      if (!currentMood || !allQuotes.length) return;
      const filtered = allQuotes.filter(q => q.category === currentMood.category);
      currentMoodQuote = filtered.length ? filtered[Math.floor(Math.random()*filtered.length)] : allQuotes[Math.floor(Math.random()*allQuotes.length)];
      $('moodPrompt').textContent = currentMood.prompts[Math.floor(Math.random()*currentMood.prompts.length)];
      $('moodQuote').textContent = `"${currentMoodQuote.text}"`;
    }

    $('moodNew').onclick = showMoodQuote;
    $('moodSave').onclick = () => {
      if (!currentMoodQuote) return;
      let favs = JSON.parse(localStorage.getItem('dose_favs')||'[]');
      if (!favs.some(f=>f.text===currentMoodQuote.text)) {
        favs.unshift({...currentMoodQuote, savedAt:Date.now()});
        localStorage.setItem('dose_favs', JSON.stringify(favs));
        alert('Saved to your journal!');
      } else { alert('Already saved!'); }
    };

    // Breathing
    let breathInterval = null;
    $('breathBtn').onclick = () => { if (breathInterval) { stopBreathing(); } else { startBreathing(); } };

    function startBreathing() {
      $('breathBtn').textContent = 'Stop';
      const circle = $('breathCircle');
      const text = $('breathText');
      const inst = $('breathInstruction');
      let phase = 0;
      const phases = [
        { name:'INHALE', dur:4000, cls:'inhale' },
        { name:'HOLD', dur:7000, cls:'hold' },
        { name:'EXHALE', dur:8000, cls:'exhale' }
      ];
      let count = 0;
      function nextPhase() {
        const p = phases[phase];
        circle.className = 'breath-circle ' + p.cls;
        text.textContent = p.name;
        inst.textContent = `Cycle ${count+1} — ${p.name.toLowerCase()} for ${p.dur/1000}s`;
        phase = (phase + 1) % 3;
        if (phase === 0) count++;
        breathInterval = setTimeout(nextPhase, p.dur);
      }
      nextPhase();
    }

    function stopBreathing() {
      clearTimeout(breathInterval);
      breathInterval = null;
      $('breathCircle').className = 'breath-circle';
      $('breathText').textContent = 'Ready?';
      $('breathInstruction').textContent = '';
      $('breathBtn').textContent = 'Start Breathing';
    }

    const AFFIRMATIONS = [
      "I am enough, exactly as I am today.","I choose progress over perfection.",
      "My potential is limitless when I believe in myself.","I am worthy of the life I am creating.",
      "Every day is a new chance to become who I want to be.","I trust the timing of my life.",
      "I am stronger than my excuses.","I deserve the peace I keep giving to others.",
      "I am becoming the person I needed when I was younger.","My journey is mine, and it is beautiful.",
      "I release what I cannot control.","I am proud of how far I have come.",
      "I give myself permission to rest without guilt.","I attract abundance by being grateful for what I have.",
      "I am building a life I don't need a vacation from.","My mistakes don't define me. My comeback will.",
      "I am allowed to outgrow versions of myself.","I choose to see challenges as opportunities to grow.",
      "I am worthy of love, success, and happiness.","Today I choose me."
    ];
    $('affirmation').textContent = AFFIRMATIONS[new Date().getDate() % AFFIRMATIONS.length];

    async function init() {
      try { const res = await fetch('/api/quotes'); allQuotes = await res.json(); } catch(e) {}
      renderMoods();
    }
    init();
  </script>
</body>
</html>
