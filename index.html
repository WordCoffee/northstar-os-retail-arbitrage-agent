<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northstar OS - Retail Arbitrage Suite</title>
  <meta name="description" content="Northstar OS — Retail arbitrage intelligence platform. Automated Amazon search, Costco cost-basis matching, ROI scoring, and deal export.">
  
  <!-- Design Tokens -->
  <link rel="stylesheet" href="src/styles/design-tokens.css">
  <link rel="stylesheet" href="src/styles/glassmorphism.css">
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolygon points='12,2 2,7 12,12 22,7'%3E%3C/polygon%3E%3Cpolygon points='12,12 2,17 12,22 22,17'%3E%3C/polygon%3E%3Ccircle cx='12' cy='12' r='3'%3E%3C/circle%3E%3C/svg%3E">
  
  <!-- Service Workers (for PWA functionality) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          })
          .catch(error => {
            console.log('ServiceWorker registration failed: ', error);
          });
      });
    }
  </script>
</head>
<body>
  <!-- Northstar OS Layout -->
  <div id="northstar-app">
    <!-- Layout will be loaded here -->
  </div>

  <!-- Main Application Script -->
  <script type="module" src="src/components/Layout/Layout.js"></script>
  
  <!-- Analytics (optional) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>
</body>
</html>
