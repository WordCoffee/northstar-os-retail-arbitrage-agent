# Hosted (free private beta) override for docker-compose.yml.
# ALWAYS combine with the base file and a dedicated untracked env file:
#   docker compose -f docker-compose.yml -f docker-compose.hosted.yml \
#       --env-file deploy/hosted.env up -d
#
# Hosted posture: ENVIRONMENT=staging; dev shim disabled; Owner Test Mode OFF.
# Never reuse the local shell-injected dev signing key. Never use the malformed
# root .env. Provide NORTHSTAR_JWT_SECRET/ISSUER/AUDIENCE in deploy/hosted.env.

x-hosted-env: &hosted-env
  ENVIRONMENT: staging
  NS_FOUNDATION_ALLOW_REMOTE_DEV: "0"
  NORTHSTAR_OWNER_TEST_MODE: "0"
  NORTHSTAR_OWNER_SELF_APPROVAL: "0"
  # The harness rate-limit opt-out must never survive into a deploy build.
  # The API also refuses to boot with it set in staging/production
  # (rate_limiter.assert_prod_posture), and tools/check-compose-deploy.cjs
  # asserts this pin is present.
  NORTHSTAR_DISABLE_RATE_LIMIT: "0"

services:
  migrate:
    environment: *hosted-env
  api:
    environment: *hosted-env
    # The base file publishes the API on 127.0.0.1:8000 so the Vite dev server
    # can proxy to it during local harness runs (added in afc0bc8). THAT PUBLISH
    # MUST NOT SHIP: `!reset` clears the inherited ports list so the hosted
    # composition exposes the API only to the compose network (Caddy terminates
    # TLS and is the only public entry). Verified by
    # tools/check-compose-deploy.cjs.
    ports: !reset []
  worker:
    environment: *hosted-env
  scheduler:
    environment: *hosted-env

  caddy:
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config: