name: Scheduled Arbitrage Scan

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run scan
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_DATASET_ID: ${{ secrets.BRIGHTDATA_DATASET_ID }}
          SEARCH_KEYWORDS: ${{ vars.SEARCH_KEYWORDS }}
      - name: Commit updated data
        run: |
          git config user.name "northstar-bot"
          git config user.email "bot@northstar-os.local"
          git add data/products.json data/deals.json
          git commit -m "Automated scan update" || echo "No changes"
          git push
