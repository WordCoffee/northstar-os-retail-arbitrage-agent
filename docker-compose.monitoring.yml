# Monitoring overlay (2026-10-16) — OPTIONAL, local-first.
#
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Adds two small read-only tools to the running stack:
#   • Uptime Kuma (MIT) — HTTP checks + alerts for the API/UI.
#   • Dozzle (MIT)      — a live container-log viewer.
#
# Both publish on LOOPBACK ONLY (127.0.0.1) so nothing is exposed off-host and
# the deploy compose guard (tools/check-compose-deploy.cjs) is unaffected: this
# file is never part of the hosted composition.
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: northstar-uptime-kuma
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    container_name: northstar-dozzle
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  uptime-kuma-data:
