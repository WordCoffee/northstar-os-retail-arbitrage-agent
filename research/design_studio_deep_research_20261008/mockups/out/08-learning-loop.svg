="#b0afa0">org_id + keyword_id access</text><line x1="1043.00" y1="618.00" x2="1043.00" y2="674.00" stroke="rgba(26,46,26,0.08)" stroke-width="1" stroke-linecap="butt"/><text x="46.00" y="704.00" font-family="'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#5a5a4a">All four exist as code today. The loop needs no new backend data source — it needs the Design Studio to read them and write back.</text><line x1="28.00" y1="1000.00" x2="1412.00" y2="1000.00" stroke="rgba(26,46,26,0.08)" stroke-width="1" stroke-linecap="butt"/><text x="28.00" y="1018.00" font-family="'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" font-weight="400" fill="#b0afa0">Render 08 — the loop. The data contracts named here are real repo symbols, verified by code read. The measurement link (6) is the only one that depends on a connected ad or listing data source; until then it reads UNKNOWN rather than a placeholder.</text></svg>
