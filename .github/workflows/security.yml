# Security CI — Secure Control-Layer build. HARDENED:
#   - every action is pinned to a full commit SHA (tags move; SHAs do not;
#     SHAs resolved via the GitHub API on 2026-10-11)
#   - least privilege: top-level `permissions: {}`; each job opts into the
#     minimum it needs; checkout never persists credentials
#   - per-job timeouts + run concurrency (duplicate runs cancel)
#
# Jobs:
#   secret-scan  (BLOCKING)  offline scanner (fingerprint-exact allowlist +
#                growth-guarded known-active baseline) + the tests/security
#                harness (includes the baseline-growth guard). Only NEW
#                findings fail; KNOWN-ACTIVE stays visible in the output.
#   gitleaks     (advisory)  gitleaks has no hash-based allowlist → advisory
#                until the fingerprint-filter wrapper lands. Personal repos
#                need no license; orgs set GITLEAKS_LICENSE.
#   audit        (advisory)  pip-audit (frozen uv.lock export), npm audit
#                (root + UI), SBOM (SPDX) artifact. Flip to blocking after
#                the first triage cycle.
name: security

on:
  push:
  pull_request:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest
      - name: Offline secret scan (tracked; allowlist + baseline aware)
        run: python -m northstar.security.secret_scan --tracked
      - name: Security tests (harness + baseline-growth guard)
        run: python -m pytest tests/security -q

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install audit tooling (pip-audit + pinned uv)
        run: python -m pip install --upgrade pip "uv==0.13.0" pip-audit
      - name: pip-audit (frozen uv.lock export)
        working-directory: Northstar_backend
        run: |
          uv export --frozen --no-hashes --output-file /tmp/northstar-requirements.txt
          pip-audit -r /tmp/northstar-requirements.txt || true
      - name: npm audit (root)
        run: npm audit --audit-level=high || true
      - name: npm audit (UI)
        working-directory: northstar-os-ui
        run: npm audit --audit-level=high || true
      - name: SBOM (SPDX JSON artifact)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          artifact-name: northstar-sbom.spdx.json
          upload-artifact: true

  rls-lint:
    # Advisory (Phase-3 adoption of pgrls): lints Postgres RLS policies from
    # our migration set in a throwaway Postgres (uses the runner's Docker).
    # BASELINE NOTE: our migrations currently contain no RLS statements, so
    # findings are expected until Phase-7 RLS lands; flip to blocking after
    # the RLS rollout + first triage cycle.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pgrls (pinned; ephemeral extra uses the runner's Docker)
        run: python -m pip install --upgrade pip "pgrls[ephemeral]==0.56.0"
      - name: Build forward-only migration set (exclude rollbacks)
        run: |
          mkdir -p /tmp/northstar-migrations
          for f in Northstar_backend/migrations_foundation/*.sql; do
            case "$f" in *rollback*) ;; *) cp "$f" /tmp/northstar-migrations/ ;; esac
          done
          ls /tmp/northstar-migrations | wc -l
      - name: RLS lint (advisory; baseline before Phase-7 RLS)
        run: pgrls lint --migrations /tmp/northstar-migrations || true

  osv-scan:
    # Advisory (Phase-3 unit 2): OSV dependency/SBOM scanning; complements the
    # `audit` job (pip-audit). Advisory until the first triage cycle completes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install osv-scanner (pinned v2.7.0; checksums-file digest pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/osv_SHA256SUMS https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_SHA256SUMS
          echo "95d69019bcfe0586eb8f07aad4c56e2f734ee969e8e3e209591f259a1bfde88c  /tmp/osv_SHA256SUMS" | sha256sum -c -
          curl -fsSL -o /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          cd /tmp && grep " osv-scanner_linux_amd64$" osv_SHA256SUMS | sed 's/ osv-scanner_linux_amd64$/ osv-scanner/' | sha256sum -c -
          chmod +x /tmp/osv-scanner
      - name: OSV scan (advisory)
        run: /tmp/osv-scanner scan source -r . || true

  grype-scan:
    # Advisory (Phase-3 unit 2): grype image/FS vulnerability scan (its own DB).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install grype (pinned v0.120.1; checksums-file digest pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/grype_checksums.txt https://github.com/anchore/grype/releases/download/v0.120.1/grype_0.120.1_checksums.txt
          echo "c25b6095265b44fd9bbb9dbe76aca8daa394c5f0490793d2b52b16be4f5b71b1  /tmp/grype_checksums.txt" | sha256sum -c -
          curl -fsSL -o /tmp/grype.tar.gz https://github.com/anchore/grype/releases/download/v0.120.1/grype_0.120.1_linux_amd64.tar.gz
          cd /tmp && grep " grype_0.120.1_linux_amd64.tar.gz$" grype_checksums.txt | sha256sum -c -
          tar -xzf /tmp/grype.tar.gz -C /tmp
      - name: Grype scan (advisory)
        run: /tmp/grype dir:. --output table || true
